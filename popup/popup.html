<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>This week's lunches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700&display=swap">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="head">
  <h1 id="title">Lunches</h1>
  <div class="meta">
    <p id="updated" class="updated"></p>
    <button type="button" id="check" class="check">Check now</button>
  </div>
</header>
<div id="login" class="login" hidden>
  <p>Your portal login has expired, so lunches can't be checked.</p>
  <button type="button" id="login-btn" class="login-btn">Log in</button>
</div>
<main id="list" class="list" aria-live="polite"></main>
<footer class="foot">
  <button type="button" id="open" class="open">Open planner</button>
</footer>
<script src="../src/storage.js"></script>
<script src="popup.js"></script>
</body>
</html>
